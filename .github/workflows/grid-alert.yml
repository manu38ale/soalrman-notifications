name: grid-alert
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Poll Solarman
        env:
          SOLARMAN_APP_ID: ${{ secrets.SOLARMAN_APP_ID }}
          SOLARMAN_APP_SECRET: ${{ secrets.SOLARMAN_APP_SECRET }}
          SOLARMAN_EMAIL: ${{ secrets.SOLARMAN_EMAIL }}
          SOLARMAN_PASSWORD: ${{ secrets.SOLARMAN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node grid-alert-poller.js
      - name: Save state
        run: |
          git config user.name "grid-alert-bot"
          git config user.email "grid-alert-bot@local"
          git add grid-alert-state.json
          git diff --staged --quiet || git commit -m "update grid state"
          git push
